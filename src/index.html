<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      首帧主题 + 壁纸预加载。这段脚本刻意不依赖打包产物：

      整站是 CSR，若等 React bundle（260 KB）落地后才设主题，首帧会按错误的色阶绘制；
      更要紧的是壁纸——它以前是 `import` 进 JS 再交给 <img> 渲染的，浏览器必须等 JS
      下载 + 执行 + React 渲染出 DOM 才知道图片地址，图片请求白白晚一整段（二次瀑布）。
      放在这里之后：主题在样式表生效前落定，壁纸与 260 KB JS 并行下载，LCP 不再挂在 JS 后面。

      ⚠️ 判定口径与 src/theme.ts 的 getThemePref / WALLPAPER 是同一套，改一边必须同步另一边。
    -->
    <script>
      (function () {
        var pref = 'dark'
        try {
          var stored = localStorage.getItem('status-trio.landing.theme')
          if (stored === 'dark' || stored === 'light') pref = stored
          else if (window.matchMedia('(prefers-color-scheme: light)').matches) pref = 'light'
        } catch (err) {
          /* 隐私模式下 localStorage 不可读，保持默认 dark */
        }
        var root = document.documentElement
        root.dataset.theme = pref
        root.style.colorScheme = pref
        var link = document.createElement('link')
        link.rel = 'preload'
        link.as = 'image'
        link.setAttribute('fetchpriority', 'high')
        link.href = './wallpaper/' + pref + '.webp'
        document.head.appendChild(link)
      })()
    </script>
    <!-- 版本号来自 GitHub API：提前建连，省掉一次 DNS + TLS 往返 -->
    <link rel="preconnect" href="https://api.github.com" crossorigin />
    <meta
      name="description"
      content="Status Trio 是一个原生 macOS 菜单栏应用，将 Wi-Fi、电池和音量整合进一个紧凑、可配置的菜单栏图标。允许自定义多种外观配置。"
    />
    <meta name="theme-color" content="#141b28" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#dfe7f2" media="(prefers-color-scheme: light)" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Status Trio · iPhone duo 同款三合一图标" />
    <meta
      property="og:description"
      content="Status Trio 是一个原生 macOS 菜单栏应用，将 Wi-Fi、电池和音量整合进一个紧凑、可配置的菜单栏图标。允许自定义多种外观配置。"
    />
    <meta name="twitter:card" content="summary" />
    <title>Status Trio · iPhone duo 同款三合一图标</title>
    <!--
      百度统计。站内 ID 与 lingai.net 主站同源（b00bcc1182fab106238c46cdebcc102d），
      与主站那段用的是同一套 hostname 判定：只统计 lingai.net 及其子域，
      本地 dev / preview / 其他域名一律不上报，避免开发期污染数据。

      放在 head 末尾而非更靠前：它只是埋点，不该跟「主题 + 壁纸」那段首帧关键脚本
      抢解析，更不能挡住壁纸预加载（fetchpriority=high）。insertBefore 插在文档第一个
      script 之前 = 异步注入，不阻塞 HTML 解析。
    -->
    <script>
      var _hmt = _hmt || []
      ;(function () {
        var host = location.hostname
        if (host !== 'lingai.net' && !host.endsWith('.lingai.net')) {
          return
        }
        var hm = document.createElement('script')
        hm.src = 'https://hm.baidu.com/hm.js?b00bcc1182fab106238c46cdebcc102d'
        var s = document.getElementsByTagName('script')[0]
        s.parentNode.insertBefore(hm, s)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
